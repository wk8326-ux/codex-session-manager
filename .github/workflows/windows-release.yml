name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python build dependencies
        run: python -m pip install -r packaging/requirements-build.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/manage-system-startup.ps1',
            'scripts/build-python-runtime.ps1',
            'scripts/build-desktop.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$script contains PowerShell syntax errors: $errors"
            }
          }

      - name: Build desktop artifacts
        shell: powershell
        run: ./scripts/build-desktop.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: LocalProjectConsole-Windows-x64
          path: release/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/*
          generate_release_notes: true
