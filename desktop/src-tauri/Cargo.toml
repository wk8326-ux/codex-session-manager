[package]
name = "local-project-console-desktop"
version = "0.1.0"
description = "Native Windows shell for Local Project Console"
authors = ["wk8326-ux"]
edition = "2021"

[lib]
name = "local_project_console_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "LocalProjectConsole"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
open = "5.3.2"
rfd = "0.15.4"
semver = "1.0.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tauri = { version = "2.8.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.3.4"
tauri-plugin-notification = "2.3.1"
tauri-plugin-window-state = "2.4.0"
ureq = { version = "2.12.1", features = ["json"] }
url = "2.5.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_System_Threading"] }
